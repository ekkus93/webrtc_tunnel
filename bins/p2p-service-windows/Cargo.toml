[package]
name = "p2p-service-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap.workspace = true
p2p-core = { path = "../../crates/p2p-core" }
p2p-crypto = { path = "../../crates/p2p-crypto" }
p2p-daemon = { path = "../../crates/p2p-daemon" }
p2p-platform = { path = "../../crates/p2p-platform" }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[dev-dependencies]
rcgen = "0.14.7"
serde_json.workspace = true
tempfile = "3.27.0"
# Same version and default (aws-lc-rs) features rumqttc already builds, so the
# SCM test's in-process TLS broker adds no new crypto backend to the build.
tokio-rustls = "0.26.4"

[lints]
workspace = true
