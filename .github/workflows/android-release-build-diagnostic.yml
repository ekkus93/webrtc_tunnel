name: Android release build diagnostic

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/android-release-build-diagnostic.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    name: Capture positive signed-build diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending diagnostic status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=ci/android-release-build-diagnostic \
            -f description='capturing positive signed-build diagnostics' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Check out exact commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up pinned Android release toolchain
        uses: ./.github/actions/setup-android-release
      - name: Generate ephemeral non-production signing identity
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/android-release-diagnostic.p12"
          password=$(openssl rand -hex 24)
          alias=android-release-diagnostic
          echo "::add-mask::$password"
          umask 077
          keytool -genkeypair -storetype PKCS12 -keystore "$keystore" \
            -storepass "$password" -keypass "$password" -alias "$alias" \
            -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 2 \
            -dname 'CN=WebRTC Tunnel Build Diagnostic,OU=Non-Production,O=WebRTC Tunnel Project,C=US' -noprompt
          chmod 600 "$keystore"
          fingerprint=$(keytool -list -v -storetype PKCS12 -keystore "$keystore" \
            -storepass "$password" -alias "$alias" | PYTHONPATH=scripts python3 -c \
            'import sys; from android_release import parse_keytool_fingerprint; print(parse_keytool_fingerprint(sys.stdin.read()))')
          {
            echo "ANDROID_RELEASE_KEYSTORE_PATH=$keystore"
            echo "ANDROID_RELEASE_STORE_PASSWORD=$password"
            echo "ANDROID_RELEASE_KEY_ALIAS=$alias"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$password"
            echo "ANDROID_RELEASE_CERT_SHA256=$fingerprint"
          } >> "$GITHUB_ENV"
      - name: Capture positive signed build output
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          (
            cd android
            ./gradlew --no-daemon --stacktrace \
              -PskipRustBuild=true \
              -PproductionRelease=true \
              -PreleaseCertificateSha256="$ANDROID_RELEASE_CERT_SHA256" \
              :app:assembleRelease :app:bundleRelease
          ) 2>&1 | tee "$RUNNER_TEMP/android-release-build.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload immutable build diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: android-release-build-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/android-release-build.log
          retention-days: 3
          if-no-files-found: error
      - name: Publish terminal diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_EXIT_CODE: ${{ steps.build.outputs.exit_code }}
        run: |
          if [[ "$BUILD_EXIT_CODE" == 0 ]]; then
            state=success
            description='positive signed build passed; diagnostic artifact uploaded'
          else
            state=failure
            description="positive signed build failed with exit $BUILD_EXIT_CODE; diagnostic artifact uploaded"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=ci/android-release-build-diagnostic \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Delete ephemeral signing material
        if: always()
        run: rm -f "${ANDROID_RELEASE_KEYSTORE_PATH:-}"
      - name: Preserve positive build result
        if: always()
        env:
          BUILD_EXIT_CODE: ${{ steps.build.outputs.exit_code }}
        run: |
          [[ "$BUILD_EXIT_CODE" =~ ^[0-9]+$ ]]
          exit "$BUILD_EXIT_CODE"
