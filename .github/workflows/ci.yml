name: CI

on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      android: ${{ steps.detect.outputs.android }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history so `git diff` against an arbitrary base commit always has
          # both endpoints available locally.
          fetch-depth: 0

      # macOS and Android builds are the expensive jobs (real runner-minutes, real
      # money); this decides whether each actually needs to run. Tags are release
      # builds and always run everything, regardless of what changed, so nothing
      # about the release pipeline depends on diffing an arbitrary tagged commit.
      - name: Detect changed paths
        id: detect
        shell: bash
        run: |
          rust_path_pattern='^(\.cargo/|\.github/actions/|\.github/workflows/ci\.yml$|bins/|crates/|scripts/|tests/|docs/examples/|Cargo\.toml$|Cargo\.lock$|rust-toolchain(\.toml)?$|clippy\.toml$|rustfmt\.toml$|\.rustfmt\.toml$)'
          android_path_pattern='^(\.cargo/|\.github/actions/|\.github/workflows/ci\.yml$|android/|bins/|crates/|tests/|Cargo\.toml$|Cargo\.lock$|rust-toolchain(\.toml)?$)'

          detect_paths() {
            local paths="$1"
            if grep -qE "$rust_path_pattern" <<< "$paths"; then
              rust=true
            else
              rust=false
            fi
            if grep -qE "$android_path_pattern" <<< "$paths"; then
              android=true
            else
              android=false
            fi
          }

          assert_flags() {
            local sample_path="$1"
            local expected_rust="$2"
            local expected_android="$3"
            detect_paths "$sample_path"
            if [ "$rust" != "$expected_rust" ] || [ "$android" != "$expected_android" ]; then
              echo "path classification regression for $sample_path: rust=$rust android=$android; expected rust=$expected_rust android=$expected_android" >&2
              exit 1
            fi
          }

          # Permanent negative/positive fixtures for the path gate. These directly use
          # the same classifier as the real changed-file list, so a future regex edit
          # cannot silently stop running CI for scripts, E2E tests, shared build inputs,
          # or composite actions while still passing a disconnected test.
          assert_flags "crates/p2p-tunnel/src/lib.rs" true true
          assert_flags "scripts/check-systemd-units.sh" true false
          assert_flags "tests/e2e/android_tunnel_e2e.sh" true true
          assert_flags "docs/examples/offer-config.toml" true false
          assert_flags "android/app/src/main/AndroidManifest.xml" false true
          assert_flags ".github/actions/example/action.yml" true true
          assert_flags "docs/architecture.md" false false

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            changed="(tag push; running the full matrix regardless of paths)"
            rust=true
            android=true
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
            else
              base="${{ github.event.before }}"
            fi

            # A missing/all-zero base (force-push, brand-new branch, first commit)
            # means there is nothing safe to diff against — run everything rather
            # than silently skipping every expensive job.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
              changed="(no usable base commit; running the full matrix)"
              rust=true
              android=true
            else
              changed=$(git diff --name-only "$base" "${{ github.sha }}")
              detect_paths "$changed"
            fi
          fi

          echo "Changed files:"
          echo "$changed"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Release profile has debug_assertions off, so it catches warnings that the
      # debug --all-targets run misses (e.g. imports used only under
      # cfg(debug_assertions)). No --all-targets here: the integration tests
      # depend on debug-only test hooks and intentionally do not build in release.
      - name: Run clippy (release profile)
        run: cargo clippy --workspace --release --all-features -- -D warnings

  test:
    name: Test (Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

      - name: Validate systemd units
        run: scripts/check-systemd-units.sh

      - name: Debian package/install smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot
          scripts/test-debian-package.sh

      - name: Install mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto

      - name: Build offer/answer/p2pctl binaries for the signal lifecycle test
        run: cargo build -p p2p-offer -p p2p-answer -p p2pctl

      # Required, not a self-skipping best-effort check: a real mosquitto broker
      # is provisioned above, so this test must not silently skip here the way it
      # may in an unprovisioned local checkout.
      - name: Run required real-process signal lifecycle test
        env:
          P2P_REQUIRE_SIGNAL_TEST: "1"
          P2P_OFFER_BIN: ${{ github.workspace }}/target/debug/p2p-offer
          P2P_ANSWER_BIN: ${{ github.workspace }}/target/debug/p2p-answer
        run: cargo test -p p2p-daemon --test process_signal_shutdown -- --nocapture

  # Expensive (real macOS runner-minutes): only runs when Rust source relevant to
  # it changed, or on a release tag — see the `changes` job above.
  test-macos:
    name: Test (macOS)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

      - name: Validate launchd plists
        run: scripts/check-launchd-plists.sh

      - name: launchd install-layout smoke test
        run: sudo scripts/test-launchd-install-layout.sh

      - name: Install mosquitto
        run: brew install mosquitto

      - name: Build offer/answer/p2pctl binaries for the signal lifecycle test
        run: cargo build -p p2p-offer -p p2p-answer -p p2pctl

      # Required, not a self-skipping best-effort check: a real mosquitto broker
      # is provisioned above (native process, not Docker, which GitHub's macOS
      # runners do not provide), so this test must not silently skip here the way
      # it may in an unprovisioned local checkout.
      - name: Run required real-process signal lifecycle test
        env:
          P2P_REQUIRE_SIGNAL_TEST: "1"
          P2P_OFFER_BIN: ${{ github.workspace }}/target/debug/p2p-offer
          P2P_ANSWER_BIN: ${{ github.workspace }}/target/debug/p2p-answer
        run: cargo test -p p2p-daemon --test process_signal_shutdown -- --nocapture

  # Expensive (full NDK + Gradle build): only runs when android/, a shared Rust
  # crate/binary, or the workspace manifest changed, or on a release tag — see the
  # `changes` job above.
  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          # Skip the action's default "tools platform-tools" install: "tools" is the
          # long-deprecated legacy SDK Tools bundle (includes the old standalone
          # emulator) and its download from Google's CDN has been failing with
          # "Error reading Zip content from a SeekableByteChannel" — a corrupted/
          # truncated zip, not anything this workflow controls. Nothing here needs
          # that package anyway; the next step explicitly installs platform-tools
          # plus everything else actually required.
          packages: ""

      - name: Install Android SDK components
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"

      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android Rust JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build -p p2p-mobile --release

      - name: Run full Gradle check (ktlint, type-resolved detekt, Android lint, unit tests)
        run: |
          cd android
          ./gradlew --no-daemon check
        # FIX7 P2-002-C: `check` (not a plain `detekt` task) is required here so the
        # type-resolved detektMain/detektTest/detektDebugAndroidTest tasks actually run in CI —
        # rules needing type resolution (InjectDispatcher, UseOrEmpty, IgnoredReturnValue's
        # @CheckResult enforcement) were previously only exercised locally, never in CI.

      - name: Run foreground-service stop-failure truthfulness tests
        run: |
          cd android
          ./gradlew --no-daemon testDebugUnitTest \
            --tests '*TunnelForegroundServiceStopFailureTest'

      - name: Build Android app and run unit tests
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      # FIX8 P2-001-D: preserve first-failure diagnostics — ktlint/detekt/lint HTML reports and
      # JUnit XML results — as a downloadable artifact rather than relying solely on the raw
      # (truncated, hard-to-search) step log. Runs regardless of which prior step failed.
      - name: Upload Android lint/test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-failure-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14

  release-artifacts:
    name: Release artifacts (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - lint
      - test
      - test-macos
      - android
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Package release binaries
        shell: bash
        run: |
          artifact_dir="rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}"
          mkdir -p "$artifact_dir"
          cp target/release/p2pctl "$artifact_dir/"
          cp target/release/p2p-offer "$artifact_dir/"
          cp target/release/p2p-answer "$artifact_dir/"
          cp README.md LICENSE "$artifact_dir/"
          tar -czf "${artifact_dir}.tar.gz" "$artifact_dir"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}
          path: rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}.tar.gz

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}.tar.gz
          generate_release_notes: true
