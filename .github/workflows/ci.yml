name: CI

on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      android: ${{ steps.detect.outputs.android }}
      full_signoff: ${{ steps.detect.outputs.full_signoff }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          rust_path_pattern='^(\.cargo/|\.github/actions/|\.github/workflows/ci\.yml$|bins/|crates/|scripts/|tests/|docs/examples/|Cargo\.toml$|Cargo\.lock$|rust-toolchain(\.toml)?$|clippy\.toml$|rustfmt\.toml$|\.rustfmt\.toml$)'
          android_path_pattern='^(\.cargo/|\.github/actions/|\.github/workflows/ci\.yml$|android/|bins/|crates/|tests/|Cargo\.toml$|Cargo\.lock$|rust-toolchain(\.toml)?$)'

          detect_paths() {
            local paths="$1"
            if grep -qE "$rust_path_pattern" <<< "$paths"; then
              rust=true
            else
              rust=false
            fi
            if grep -qE "$android_path_pattern" <<< "$paths"; then
              android=true
            else
              android=false
            fi
          }

          assert_flags() {
            local sample_path="$1"
            local expected_rust="$2"
            local expected_android="$3"
            detect_paths "$sample_path"
            if [ "$rust" != "$expected_rust" ] || [ "$android" != "$expected_android" ]; then
              echo "path classification regression for $sample_path: rust=$rust android=$android; expected rust=$expected_rust android=$expected_android" >&2
              exit 1
            fi
          }

          assert_flags "crates/p2p-tunnel/src/lib.rs" true true
          assert_flags "scripts/check-systemd-units.sh" true false
          assert_flags "tests/e2e/android_tunnel_e2e.sh" true true
          assert_flags "docs/examples/offer-config.toml" true false
          assert_flags "android/app/src/main/AndroidManifest.xml" false true
          assert_flags ".github/actions/example/action.yml" true true
          assert_flags "docs/architecture.md" false false

          full_signoff=false
          if [[ "${{ github.ref }}" == refs/tags/* ]] || [[ "$HEAD_COMMIT_MESSAGE" == *"[full-signoff]"* ]]; then
            full_signoff=true
          fi

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            changed="(tag push; running the full matrix regardless of paths)"
            rust=true
            android=true
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
            else
              base="${{ github.event.before }}"
            fi

            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
              changed="(no usable base commit; running the full matrix)"
              rust=true
              android=true
            else
              changed=$(git diff --name-only "$base" "${{ github.sha }}")
              detect_paths "$changed"
            fi
          fi

          echo "Changed files:"
          echo "$changed"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "full_signoff=$full_signoff" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run clippy (release profile)
        run: cargo clippy --workspace --release --all-features -- -D warnings

  test:
    name: Test (Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features
      - name: Validate systemd units
        run: scripts/check-systemd-units.sh
      - name: Debian package/install smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot
          scripts/test-debian-package.sh
      - name: Install mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
      - name: Build offer/answer/p2pctl binaries for the signal lifecycle test
        run: cargo build -p p2p-offer -p p2p-answer -p p2pctl
      - name: Run required real-process signal lifecycle test
        env:
          P2P_REQUIRE_SIGNAL_TEST: "1"
          P2P_OFFER_BIN: ${{ github.workspace }}/target/debug/p2p-offer
          P2P_ANSWER_BIN: ${{ github.workspace }}/target/debug/p2p-answer
        run: cargo test -p p2p-daemon --test process_signal_shutdown -- --nocapture

  test-macos:
    name: Test (macOS)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features
      - name: Validate launchd plists
        run: scripts/check-launchd-plists.sh
      - name: launchd install-layout smoke test
        run: sudo scripts/test-launchd-install-layout.sh
      - name: Install mosquitto
        run: brew install mosquitto
      - name: Build offer/answer/p2pctl binaries for the signal lifecycle test
        run: cargo build -p p2p-offer -p p2p-answer -p p2pctl
      - name: Run required real-process signal lifecycle test
        env:
          P2P_REQUIRE_SIGNAL_TEST: "1"
          P2P_OFFER_BIN: ${{ github.workspace }}/target/debug/p2p-offer
          P2P_ANSWER_BIN: ${{ github.workspace }}/target/debug/p2p-answer
        run: cargo test -p p2p-daemon --test process_signal_shutdown -- --nocapture

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK components
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build Android Rust JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build -p p2p-mobile --release
      - name: Run full Gradle check
        run: |
          cd android
          ./gradlew --no-daemon check
      - name: Run foreground-service stop-failure truthfulness tests
        run: |
          cd android
          ./gradlew --no-daemon testDebugUnitTest --tests '*TunnelForegroundServiceStopFailureTest'
      - name: Build Android app and run unit tests
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Upload Android lint/test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-failure-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14

  docker-e2e:
    name: Docker real-data-path E2E
    needs:
      - changes
      - test
    if: needs.changes.outputs.full_signoff == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release -p p2p-offer -p p2p-answer -p p2pctl
      - name: Run full TLS broker and tunnel E2E
        run: tests/e2e/docker/run.sh
      - name: Run Docker signal and graceful-stop lifecycle E2E
        run: tests/e2e/docker/stop_lifecycle.sh

  android-emulator-e2e:
    name: Android emulator real-data-path E2E
    needs:
      - changes
      - android
    if: needs.changes.outputs.full_signoff == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK components
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build Android Rust JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build -p p2p-mobile --release
      - name: Build debug APK and E2E host binaries
        run: |
          cargo build -p p2pctl
          cargo build --release -p p2p-answer
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Run Android offer to dockerized answer E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ADB="$ANDROID_HOME/platform-tools/adb" REBUILD=0 ANDROID_ICE_MODE=native tests/e2e/android_tunnel_e2e.sh

  signoff:
    name: Full matrix signoff
    if: always()
    needs:
      - changes
      - lint
      - test
      - test-macos
      - android
      - docker-e2e
      - android-emulator-e2e
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs and publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          ANDROID_REQUIRED: ${{ needs.changes.outputs.android }}
          FULL_SIGNOFF: ${{ needs.changes.outputs.full_signoff }}
          LINT_RESULT: ${{ needs.lint.result }}
          LINUX_RESULT: ${{ needs.test.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          DOCKER_E2E_RESULT: ${{ needs.docker-e2e.result }}
          ANDROID_EMULATOR_E2E_RESULT: ${{ needs.android-emulator-e2e.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=success
          description="full required matrix passed"

          require_result() {
            local job_name="$1"
            local actual="$2"
            local expected="$3"
            if [ "$actual" != "$expected" ]; then
              state=failure
              description="$job_name was $actual; expected $expected"
            fi
          }

          require_result "path detection" "$CHANGES_RESULT" success
          if [ "$RUST_REQUIRED" = true ]; then
            require_result "Rust lint" "$LINT_RESULT" success
            require_result "Linux tests" "$LINUX_RESULT" success
            require_result "macOS tests" "$MACOS_RESULT" success
          else
            require_result "Rust lint" "$LINT_RESULT" skipped
            require_result "Linux tests" "$LINUX_RESULT" skipped
            require_result "macOS tests" "$MACOS_RESULT" skipped
          fi

          if [ "$ANDROID_REQUIRED" = true ]; then
            require_result "Android" "$ANDROID_RESULT" success
          else
            require_result "Android" "$ANDROID_RESULT" skipped
          fi

          matrix_state="$state"
          matrix_description="$description"

          post_status() {
            local context="$1"
            local status_state="$2"
            local status_description="$3"
            local payload
            payload=$(printf '{"state":"%s","target_url":"%s","description":"%s","context":"%s"}' \
              "$status_state" "$TARGET_URL" "$status_description" "$context")
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
              --data "$payload"
          }

          post_status "ci/full-matrix" "$matrix_state" "$matrix_description"

          if [ "$FULL_SIGNOFF" = true ]; then
            require_result "Docker E2E" "$DOCKER_E2E_RESULT" success
            require_result "Android emulator E2E" "$ANDROID_EMULATOR_E2E_RESULT" success
            post_status "ci/release-candidate" "$state" "$description"
          else
            require_result "Docker E2E" "$DOCKER_E2E_RESULT" skipped
            require_result "Android emulator E2E" "$ANDROID_EMULATOR_E2E_RESULT" skipped
          fi

          if [ "$state" != success ]; then
            echo "$description" >&2
            exit 1
          fi

  release-artifacts:
    name: Release artifacts (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - lint
      - test
      - test-macos
      - android
      - docker-e2e
      - android-emulator-e2e
      - signoff
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Package release binaries
        shell: bash
        run: |
          artifact_dir="rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}"
          mkdir -p "$artifact_dir"
          cp target/release/p2pctl "$artifact_dir/"
          cp target/release/p2p-offer "$artifact_dir/"
          cp target/release/p2p-answer "$artifact_dir/"
          cp README.md LICENSE "$artifact_dir/"
          tar -czf "${artifact_dir}.tar.gz" "$artifact_dir"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}
          path: rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}.tar.gz
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}.tar.gz
          generate_release_notes: true
