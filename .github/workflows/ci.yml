name: CI

on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact master SHA this full-signoff run must validate
        required: false
        default: ""
        type: string
      full_signoff:
        description: Force the release-candidate matrix regardless of changed paths
        required: false
        default: false
        type: boolean
      package_release:
        description: Build and verify the Windows release zip and MSI on a hosted runner, without publishing anything
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      android: ${{ steps.detect.outputs.android }}
      full_signoff: ${{ steps.detect.outputs.full_signoff }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: Detect changed paths
        id: detect
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUESTED_FULL_SIGNOFF: ${{ inputs.full_signoff }}
        run: |
          set -euo pipefail
          if [[ -n "${EXPECTED_SHA}" ]]; then
            if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'expected_sha must be a full lowercase commit SHA\n' >&2
              exit 1
            fi
            if [[ "${EXPECTED_SHA}" != "${GITHUB_SHA}" ]]; then
              printf 'workflow dispatch SHA mismatch: expected=%s event=%s\n' \
                "${EXPECTED_SHA}" "${GITHUB_SHA}" >&2
              exit 1
            fi
          fi

          rust_path_pattern='^(\.cargo/|\.github/actions/|\.github/workflows/|bins/|crates/|scripts/|tests/|docs/examples/|packaging/|Cargo\.toml$|Cargo\.lock$|rust-toolchain(\.toml)?$|clippy\.toml$|rustfmt\.toml$|\.rustfmt\.toml$)'
          android_path_pattern='^(\.cargo/|\.github/actions/|\.github/workflows/|android/|bins/|crates/|tests/|Cargo\.toml$|Cargo\.lock$|rust-toolchain(\.toml)?$)'

          detect_paths() {
            local paths="$1"
            if grep -qE "$rust_path_pattern" <<< "$paths"; then
              rust=true
            else
              rust=false
            fi
            if grep -qE "$android_path_pattern" <<< "$paths"; then
              android=true
            else
              android=false
            fi
          }

          assert_flags() {
            local sample_path="$1"
            local expected_rust="$2"
            local expected_android="$3"
            detect_paths "$sample_path"
            if [ "$rust" != "$expected_rust" ] || [ "$android" != "$expected_android" ]; then
              echo "path classification regression for $sample_path: rust=$rust android=$android; expected rust=$expected_rust android=$expected_android" >&2
              exit 1
            fi
          }

          assert_flags "crates/p2p-tunnel/src/lib.rs" true true
          assert_flags "scripts/check-systemd-units.sh" true false
          assert_flags "tests/e2e/android_tunnel_e2e.sh" true true
          assert_flags "docs/examples/offer-config.toml" true false
          assert_flags "packaging/windows/install.ps1" true false
          assert_flags "android/app/src/main/AndroidManifest.xml" false true
          assert_flags ".github/actions/example/action.yml" true true
          assert_flags ".github/workflows/rc-diagnostics.yml" true true
          assert_flags "docs/architecture.md" false false

          full_signoff=false
          if [[ "${{ github.ref }}" == refs/tags/* ]] \
            || [[ "$HEAD_COMMIT_MESSAGE" == *"[full-signoff]"* ]] \
            || [[ "${REQUESTED_FULL_SIGNOFF}" == true ]]; then
            full_signoff=true
          fi

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            changed="(tag push; running the full matrix regardless of paths)"
            rust=true
            android=true
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
            else
              base="${{ github.event.before }}"
            fi

            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
              changed="(no usable base commit; running the full matrix)"
              rust=true
              android=true
            else
              changed=$(git diff --name-only "$base" "${{ github.sha }}")
              detect_paths "$changed"
            fi
          fi

          # A release-candidate, dispatched closure, or tag signoff must never inherit a path skip.
          if [ "$full_signoff" = true ]; then
            rust=true
            android=true
          fi

          echo "Changed files:"
          echo "$changed"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "full_signoff=$full_signoff" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - name: Run exact-SHA closure unit tests
        run: PYTHONPATH=scripts python3 -m unittest -v scripts/test_exact_sha_closure.py
      - name: Run Android release contract unit tests
        run: PYTHONPATH=scripts python3 -m unittest -v scripts/test_android_release.py scripts/test_android_bundle_release.py
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run clippy (release profile)
        run: cargo clippy --workspace --release --all-features -- -D warnings

  test:
    name: Test (Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features
      - name: Validate systemd units
        run: scripts/check-systemd-units.sh
      - name: Debian package/install smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot
          scripts/test-debian-package.sh
      - name: Install mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
      - name: Build offer/answer/p2pctl binaries for the signal lifecycle test
        run: cargo build -p p2p-offer -p p2p-answer -p p2pctl
      - name: Run required real-process signal lifecycle test
        env:
          P2P_REQUIRE_SIGNAL_TEST: "1"
          P2P_OFFER_BIN: ${{ github.workspace }}/target/debug/p2p-offer
          P2P_ANSWER_BIN: ${{ github.workspace }}/target/debug/p2p-answer
        run: cargo test -p p2p-daemon --test process_signal_shutdown -- --nocapture

  test-macos:
    name: Test (macOS)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features
      - name: Validate launchd plists
        run: scripts/check-launchd-plists.sh
      - name: launchd install-layout smoke test
        run: sudo scripts/test-launchd-install-layout.sh
      - name: Install mosquitto
        run: brew install mosquitto
      - name: Build offer/answer/p2pctl binaries for the signal lifecycle test
        run: cargo build -p p2p-offer -p p2p-answer -p p2pctl
      - name: Run required real-process signal lifecycle test
        env:
          P2P_REQUIRE_SIGNAL_TEST: "1"
          P2P_OFFER_BIN: ${{ github.workspace }}/target/debug/p2p-offer
          P2P_ANSWER_BIN: ${{ github.workspace }}/target/debug/p2p-answer
        run: cargo test -p p2p-daemon --test process_signal_shutdown -- --nocapture

  test-windows:
    name: Test (Windows)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features
      - name: Check Windows service scripts
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-windows-service-scripts.ps1
      # Mosquitto comes from the upstream installer, not Chocolatey: the Chocolatey
      # community repository has no `mosquitto` package. The installer is not
      # Authenticode-signed, so its SHA-256 is pinned; when bumping the version,
      # download the new installer and update both values together.
      #
      # This step was non-blocking (`continue-on-error`) until it had passed on a
      # hosted windows-latest runner, which it did in CI #667; it is now a required
      # gate like every other step.
      - name: Native mosquitto TLS broker E2E
        shell: pwsh
        env:
          P2P_REQUIRE_BROKER_TEST: "1"
          MOSQUITTO_INSTALLER_URL: https://mosquitto.org/files/binary/win64/mosquitto-2.0.22-install-windows-x64.exe
          MOSQUITTO_INSTALLER_SHA256: 2D3D57D918CC8CD4A0DF6C6812EDF1C3D723EE813B569354FF4A021E9E1D84BC
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mosquitto-install.exe'
          Invoke-WebRequest -Uri $env:MOSQUITTO_INSTALLER_URL -OutFile $installer -UseBasicParsing
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actual -ne $env:MOSQUITTO_INSTALLER_SHA256) {
            throw "mosquitto installer SHA-256 mismatch: expected $env:MOSQUITTO_INSTALLER_SHA256, got $actual"
          }
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "mosquitto installer failed ($($install.ExitCode))" }
          $mosquittoDir = Join-Path $env:ProgramFiles 'mosquitto'
          $env:P2P_MOSQUITTO_BIN = Join-Path $mosquittoDir 'mosquitto.exe'
          if (-not (Test-Path $env:P2P_MOSQUITTO_BIN)) { throw "mosquitto.exe not found at $env:P2P_MOSQUITTO_BIN" }
          $env:PATH = "$mosquittoDir;$env:PATH"
          cargo test -p p2p-daemon --test native_broker_tunnel -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "native_broker_tunnel failed ($LASTEXITCODE)" }
      # Deliberately narrower than the Linux/macOS jobs. Not run here:
      #   - the Docker broker E2E, because windows-latest runners cannot
      #     reliably host Linux containers (the native-mosquitto step above
      #     covers the same real-broker tunnel path without Docker);
      #   - the real-process signal lifecycle test, because Windows has no
      #     SIGINT/SIGTERM -- `process_signal_shutdown.rs` is `#![cfg(unix)]`.
      #     A Windows equivalent driven by the Service Control Manager's
      #     SERVICE_CONTROL_STOP belongs with the service work.

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK components
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build Android Rust JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build -p p2p-mobile --release
      - name: Run full Gradle check
        run: |
          cd android
          ./gradlew --no-daemon check
      - name: Run foreground-service stop-failure truthfulness tests
        run: |
          cd android
          ./gradlew --no-daemon testDebugUnitTest --tests '*TunnelForegroundServiceStopFailureTest'
      - name: Build Android app and run unit tests
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Upload Android lint/test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-failure-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14

  docker-e2e:
    name: Docker real-data-path E2E
    needs:
      - changes
      - test
    if: needs.changes.outputs.full_signoff == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release -p p2p-offer -p p2p-answer -p p2pctl
      - name: Run full TLS broker and tunnel E2E
        run: tests/e2e/docker/run.sh
      - name: Run Docker signal and graceful-stop lifecycle E2E
        run: tests/e2e/docker/stop_lifecycle.sh

  android-emulator-e2e:
    name: Android emulator real-data-path E2E
    needs:
      - changes
      - android
    if: needs.changes.outputs.full_signoff == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK components
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build Android Rust JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build -p p2p-mobile --release
      - name: Build debug APK and E2E host binaries
        run: |
          cargo build -p p2pctl
          cargo build --release -p p2p-answer
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android offer to dockerized answer E2E
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ADB="$ANDROID_HOME/platform-tools/adb" REBUILD=0 ANDROID_ICE_MODE=native tests/e2e/android_tunnel_e2e.sh

  signoff:
    name: Full matrix signoff
    if: always()
    needs:
      - changes
      - lint
      - test
      - test-macos
      - test-windows
      - android
      - docker-e2e
      - android-emulator-e2e
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs and publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust }}
          ANDROID_REQUIRED: ${{ needs.changes.outputs.android }}
          FULL_SIGNOFF: ${{ needs.changes.outputs.full_signoff }}
          LINT_RESULT: ${{ needs.lint.result }}
          LINUX_RESULT: ${{ needs.test.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          DOCKER_E2E_RESULT: ${{ needs.docker-e2e.result }}
          ANDROID_EMULATOR_E2E_RESULT: ${{ needs.android-emulator-e2e.result }}
          TARGET_SHA: ${{ inputs.expected_sha || github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=success
          description="full required matrix passed"

          require_result() {
            local job_name="$1"
            local actual="$2"
            local expected="$3"
            if [ "$actual" != "$expected" ]; then
              state=failure
              description="$job_name was $actual; expected $expected"
            fi
          }

          require_result "path detection" "$CHANGES_RESULT" success
          if [ "$RUST_REQUIRED" = true ]; then
            require_result "Rust lint" "$LINT_RESULT" success
            require_result "Linux tests" "$LINUX_RESULT" success
            require_result "macOS tests" "$MACOS_RESULT" success
            require_result "Windows tests" "$WINDOWS_RESULT" success
          else
            require_result "Rust lint" "$LINT_RESULT" skipped
            require_result "Linux tests" "$LINUX_RESULT" skipped
            require_result "macOS tests" "$MACOS_RESULT" skipped
            require_result "Windows tests" "$WINDOWS_RESULT" skipped
          fi

          if [ "$ANDROID_REQUIRED" = true ]; then
            require_result "Android" "$ANDROID_RESULT" success
          else
            require_result "Android" "$ANDROID_RESULT" skipped
          fi

          matrix_state="$state"
          matrix_description="$description"

          post_status() {
            local context="$1"
            local status_state="$2"
            local status_description="$3"
            local payload
            payload=$(printf '{"state":"%s","target_url":"%s","description":"%s","context":"%s"}' \
              "$status_state" "$TARGET_URL" "$status_description" "$context")
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${TARGET_SHA}" \
              --data "$payload"
          }

          post_status "ci/full-matrix" "$matrix_state" "$matrix_description"

          if [ "$FULL_SIGNOFF" = true ]; then
            require_result "Docker E2E" "$DOCKER_E2E_RESULT" success
            require_result "Android emulator E2E" "$ANDROID_EMULATOR_E2E_RESULT" success
            post_status "ci/release-candidate" "$state" "$description"
          else
            require_result "Docker E2E" "$DOCKER_E2E_RESULT" skipped
            require_result "Android emulator E2E" "$ANDROID_EMULATOR_E2E_RESULT" skipped
          fi

          if [ "$state" != success ]; then
            echo "$description" >&2
            exit 1
          fi

  release-artifacts:
    name: Release artifacts (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - lint
      - test
      - test-macos
      - test-windows
      - android
      - docker-e2e
      - android-emulator-e2e
      - signoff
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: tar.gz
          - os: macos-latest
            archive: tar.gz
          - os: windows-latest
            archive: zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Package release binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          artifact_dir="rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}"
          mkdir -p "$artifact_dir"
          cp target/release/p2pctl "$artifact_dir/"
          cp target/release/p2p-offer "$artifact_dir/"
          cp target/release/p2p-answer "$artifact_dir/"
          cp README.md LICENSE "$artifact_dir/"
          tar -czf "${artifact_dir}.tar.gz" "$artifact_dir"
      # Windows gets a .zip (the native archive format; Explorer opens it without extra
      # tools), an MSI, and a verification pass over both. All of it is done by scripts in
      # the repository, shared with the package-windows dry-run job below, so there is one
      # implementation: build-release-zip.ps1 (the zip, in the layout install.ps1 expects),
      # install-wix.ps1 + build-msi.ps1 (the MSI) and verify-windows-release.ps1 (layout,
      # docs links, `--help`, and an MSI install/uninstall on this runner). WiX 5.0.2 is
      # pinned deliberately: it is MS-RL and needs no EULA, whereas WiX 6 and later fall
      # under the Open Source Maintenance Fee EULA, which build-msi.ps1 never accepts for
      # you. The MSI is UNSIGNED (build-msi.ps1 only signs with -SignCert); SmartScreen will
      # warn on it.
      - name: Package release binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build-release-zip.ps1 -Label "rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}"
      - name: Build MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/wix/install-wix.ps1
          ./packaging/windows/wix/build-msi.ps1 -BinDir target/release -OutputPath "rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}.msi"
      - name: Verify the zip and the MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1 -Zip "rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}.zip" -Msi "rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}.msi"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}
          path: rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}.${{ matrix.archive }}
      - name: Upload MSI artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}-msi
          path: rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}.msi
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}.${{ matrix.archive }}
          generate_release_notes: true
      - name: Upload MSI release asset (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          files: rust_webrtc-${{ github.ref_name }}-${{ matrix.os }}.msi

  # Builds and verifies exactly what the Windows leg of release-artifacts would publish, on a
  # hosted runner, without a tag and without publishing anything. Run it by hand: Actions >
  # CI > Run workflow > tick "package_release". The zip and MSI are kept as workflow
  # artifacts for a week. Only the final upload to a GitHub Release stays tag-only.
  package-windows:
    name: Package (Windows, no publish)
    if: github.event_name == 'workflow_dispatch' && inputs.package_release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Package release binaries (Windows)
        shell: pwsh
        run: ./packaging/windows/build-release-zip.ps1 -Label "rust_webrtc-dryrun-windows-latest"
      - name: Build MSI (Windows)
        shell: pwsh
        run: |
          ./packaging/windows/wix/install-wix.ps1
          ./packaging/windows/wix/build-msi.ps1 -BinDir target/release -OutputPath "rust_webrtc-dryrun-windows-latest.msi"
      - name: Verify the zip and the MSI (Windows)
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1 -Zip "rust_webrtc-dryrun-windows-latest.zip" -Msi "rust_webrtc-dryrun-windows-latest.msi"
      - name: Upload the dry-run artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust_webrtc-dryrun-windows-latest
          path: |
            rust_webrtc-dryrun-windows-latest.zip
            rust_webrtc-dryrun-windows-latest.msi
          retention-days: 7
