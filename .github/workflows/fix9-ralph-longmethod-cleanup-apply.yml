name: Apply FIX9 final long-method cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/fix9-ralph-longmethod-cleanup-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Extract setup persistence request construction
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("android/app/src/main/java/com/phillipchin/webrtctunnel/viewmodel/SetupSaveController.kt")
          text = path.read_text()
          request_pattern = re.compile(
              r"        val identityChange = commitContext\.identityChange\n"
              r"        val request =\n.*?"
              r"(?=        // This is the final cancellable boundary)",
              re.DOTALL,
          )
          text, replacements = request_pattern.subn(
              "        val request =\n"
              "            buildSetupPersistenceRequest(input, candidate, prefs, forwards, commitContext)\n",
              text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit(f"expected one request-construction replacement, got {replacements}")

          marker = "\n/**\n * P0-002: Named type for resolved identity components."
          helper = '''

private fun buildSetupPersistenceRequest(
    input: SetupConfigInput,
    candidate: String,
    prefs: AndroidAppPreferences,
    forwards: List<ForwardConfig>,
    commitContext: SetupCommitContext,
): SetupPersistenceRequest {
    val identityChange = commitContext.identityChange
    return SetupPersistenceRequest(
        configContents = candidate,
        setupInput = input,
        preferences =
            prefs.copy(
                allowMetered = input.allowMetered,
                resumeOnUnmetered = input.resumeOnUnmetered,
            ),
        forwards = forwards,
        optionalChanges =
            SetupOptionalChanges(
                replacementIdentity =
                    if (identityChange.identity.fromImport) {
                        IdentityReplacement(
                            identityChange.identity.privateIdentity,
                            identityChange.identity.publicIdentity,
                        )
                    } else {
                        null
                    },
                authorizedPublicIdentityToAdd = identityChange.authorizedLine,
                brokerSecretChange =
                    if (input.brokerPasswordFile.isNotBlank()) {
                        null
                    } else if (input.brokerPassword.isNotBlank()) {
                        BrokerSecretChange.Set(input.brokerPassword)
                    } else {
                        BrokerSecretChange.Remove
                    },
            ),
    )
}
'''
          marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit("resolved-identity marker not found")
          text = text[:marker_index] + helper + text[marker_index:]
          path.write_text(text)
          PY
      - name: Commit long-method cleanup
        shell: bash
        run: |
          git rm .github/workflows/fix9-ralph-longmethod-cleanup-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/java
          git commit -m "fix9: extract setup persistence request construction"
          git pull --rebase origin master
          git push origin HEAD:master
