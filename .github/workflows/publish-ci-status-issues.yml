name: Publish CI Status Issues

on:
  workflow_run:
    workflows:
      - CI
      - RC diagnostics
      - FIX9 broker-secret instrumentation
    types:
      - requested
      - in_progress
      - completed

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: publish-ci-status-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish workflow state and apply pending FIX9 patch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish compact authoritative status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          case "$WORKFLOW_NAME" in
            "CI") issue_number=1 ;;
            "RC diagnostics") issue_number=2 ;;
            "FIX9 broker-secret instrumentation") issue_number=3 ;;
            *) exit 1 ;;
          esac
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" > "$RUNNER_TEMP/run.json"
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          python3 - "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/jobs.json" "$RUNNER_TEMP/artifacts.json" "$RUNNER_TEMP/issue.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          run_path, jobs_path, artifacts_path, issue_path = map(Path, sys.argv[1:])
          run = json.loads(run_path.read_text())
          jobs = json.loads(jobs_path.read_text()).get("jobs", [])
          artifacts = json.loads(artifacts_path.read_text()).get("artifacts", [])
          failed_jobs = [
              {"id": job.get("id"), "name": job.get("name"), "conclusion": job.get("conclusion")}
              for job in jobs
              if job.get("conclusion") in {"failure", "cancelled", "timed_out", "startup_failure"}
          ]
          failed_steps = []
          active_steps = []
          for job in jobs:
              for step in job.get("steps") or []:
                  item = {
                      "job_id": job.get("id"),
                      "job": job.get("name"),
                      "number": step.get("number"),
                      "name": step.get("name"),
                      "status": step.get("status"),
                      "conclusion": step.get("conclusion"),
                  }
                  if step.get("conclusion") in {"failure", "cancelled", "timed_out", "startup_failure"}:
                      failed_steps.append(item)
                  if step.get("status") == "in_progress":
                      active_steps.append(item)
          payload = {
              "schema_version": 3,
              "workflow": run.get("name"),
              "workflow_id": run.get("workflow_id"),
              "workflow_path": run.get("path"),
              "run_id": run.get("id"),
              "run_number": run.get("run_number"),
              "run_attempt": run.get("run_attempt"),
              "run_url": run.get("html_url"),
              "status": run.get("status"),
              "conclusion": run.get("conclusion") or "pending",
              "head_branch": run.get("head_branch"),
              "head_sha": run.get("head_sha"),
              "event": run.get("event"),
              "created_at": run.get("created_at"),
              "updated_at": run.get("updated_at"),
              "failed_jobs": failed_jobs,
              "failed_steps": failed_steps,
              "active_steps": active_steps,
              "artifacts": [
                  {
                      "id": artifact.get("id"),
                      "name": artifact.get("name"),
                      "expired": artifact.get("expired"),
                      "size_in_bytes": artifact.get("size_in_bytes"),
                  }
                  for artifact in artifacts
              ],
              "jobs": [
                  {
                      "id": job.get("id"),
                      "name": job.get("name"),
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "runner_name": job.get("runner_name"),
                  }
                  for job in jobs
              ],
          }
          body = "\n".join(
              [
                  "<!-- maintained by publish-ci-status-issues.yml -->",
                  f'# Latest {run.get("name")}',
                  "",
                  f'- **Status:** `{payload["status"]}`',
                  f'- **Conclusion:** `{payload["conclusion"]}`',
                  f'- **Run:** [{payload["run_id"]}]({payload["run_url"]})',
                  f'- **Commit:** `{payload["head_sha"]}`',
                  f'- **Failed jobs:** {", ".join(item["name"] for item in failed_jobs) if failed_jobs else "None"}',
                  f'- **Failed steps:** {", ".join(item["job"] + " / " + item["name"] for item in failed_steps) if failed_steps else "None"}',
                  f'- **Active steps:** {", ".join(item["job"] + " / " + item["name"] for item in active_steps) if active_steps else "None"}',
                  "",
                  "## Machine-readable status",
                  "",
                  "```json",
                  json.dumps(payload, indent=2, sort_keys=True),
                  "```",
              ]
          )
          issue_path.write_text(json.dumps({"body": body, "state": "open"}))
          PY
          gh api --method PATCH "repos/${REPOSITORY}/issues/${issue_number}" --input "$RUNNER_TEMP/issue.json" >/dev/null

      - name: Check out current master for pending FIX9 patch
        if: >-
          github.event.workflow_run.name == 'CI' &&
          github.event.workflow_run.status == 'completed'
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Apply pending FIX9 persistence-request extraction
        if: >-
          github.event.workflow_run.name == 'CI' &&
          github.event.workflow_run.status == 'completed'
        shell: bash
        run: |
          set -euo pipefail
          marker="docs/review-source/WEBRTC_TUNNEL_FIX9_PATCH_EXECUTOR_TRIGGER.md"
          source="android/app/src/main/java/com/phillipchin/webrtctunnel/viewmodel/SetupSaveController.kt"
          if [[ ! -f "$marker" ]]; then
            echo "FIX9 patch marker is absent; no patch is pending."
            exit 0
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("android/app/src/main/java/com/phillipchin/webrtctunnel/viewmodel/SetupSaveController.kt")
          text = path.read_text()
          if "private fun buildSetupPersistenceRequest(" not in text:
              pattern = re.compile(
                  r"        val identityChange = commitContext\.identityChange\n"
                  r"        val request =\n.*?"
                  r"(?=        // This is the final cancellable boundary)",
                  re.DOTALL,
              )
              text, count = pattern.subn(
                  "        val request =\n"
                  "            buildSetupPersistenceRequest(input, candidate, prefs, forwards, commitContext)\n",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"expected one request-construction block, got {count}")
              insertion_marker = "\n/**\n * P0-002: Named type for resolved identity components."
              helper = '''

private fun buildSetupPersistenceRequest(
    input: SetupConfigInput,
    candidate: String,
    prefs: AndroidAppPreferences,
    forwards: List<ForwardConfig>,
    commitContext: SetupCommitContext,
): SetupPersistenceRequest {
    val identityChange = commitContext.identityChange
    return SetupPersistenceRequest(
        configContents = candidate,
        setupInput = input,
        preferences =
            prefs.copy(
                allowMetered = input.allowMetered,
                resumeOnUnmetered = input.resumeOnUnmetered,
            ),
        forwards = forwards,
        optionalChanges =
            SetupOptionalChanges(
                replacementIdentity =
                    if (identityChange.identity.fromImport) {
                        IdentityReplacement(
                            identityChange.identity.privateIdentity,
                            identityChange.identity.publicIdentity,
                        )
                    } else {
                        null
                    },
                authorizedPublicIdentityToAdd = identityChange.authorizedLine,
                brokerSecretChange =
                    if (input.brokerPasswordFile.isNotBlank()) {
                        null
                    } else if (input.brokerPassword.isNotBlank()) {
                        BrokerSecretChange.Set(input.brokerPassword)
                    } else {
                        BrokerSecretChange.Remove
                    },
            ),
    )
}
'''
              index = text.find(insertion_marker)
              if index < 0:
                  raise SystemExit("resolved-identity insertion marker not found")
              path.write_text(text[:index] + helper + text[index:])
          PY

          git rm -f \
            "$marker" \
            .github/workflows/fix9-patch-after-ci.yml \
            .github/workflows/fix9-patch-on-issue.yml \
            .github/workflows/fix9-ralph-longmethod-cleanup-apply.yml \
            .github/workflows/publish-fix9-patch-status.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$source"
          git commit -m "fix9: extract setup persistence request construction"
          git push origin HEAD:master
