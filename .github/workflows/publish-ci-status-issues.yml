name: Publish CI Status Issues

on:
  workflow_run:
    workflows:
      - CI
      - RC diagnostics
      - FIX9 broker-secret instrumentation
      - Android signed release
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: publish-ci-status-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish latest workflow state
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Update authoritative status issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          case "${WORKFLOW_NAME}" in
            "CI")
              issue_number=1
              issue_title="CI Status: Main Workflow"
              heading="Latest Main CI Workflow"
              ;;
            "RC diagnostics")
              issue_number=2
              issue_title="CI Status: RC Diagnostics"
              heading="Latest RC Diagnostics"
              ;;
            "FIX9 broker-secret instrumentation")
              issue_number=3
              issue_title="CI Status: Broker Secret Instrumentation"
              heading="Latest Broker Secret Instrumentation"
              ;;
            "Android signed release")
              issue_number=6
              issue_title="CI Status: Android Signed Release — master"
              heading="Latest Android Signed Release — master"
              ;;
            *)
              printf 'Unsupported workflow: %s\n' "${WORKFLOW_NAME}" >&2
              exit 1
              ;;
          esac
          monitored_branch=master
          owner_marker='<!-- maintained by publish-ci-status-issues.yml -->'

          if [[ "${HEAD_BRANCH}" != "${monitored_branch}" ]]; then
            printf 'Ignoring %s run %s on unrelated branch %s.\n' \
              "${WORKFLOW_NAME}" "${RUN_ID}" "${HEAD_BRANCH}"
            exit 0
          fi

          latest_run_id="$(
            gh api \
              "repos/${REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?branch=${monitored_branch}&per_page=1" \
              --jq '.workflow_runs[0].id // empty'
          )"
          if [[ -z "${latest_run_id}" ]]; then
            printf 'No visible %s run on %s yet.\n' "${WORKFLOW_NAME}" "${monitored_branch}"
            exit 0
          fi
          if [[ "${latest_run_id}" != "${RUN_ID}" ]]; then
            printf 'Skipping stale run %s; latest applicable run is %s.\n' \
              "${RUN_ID}" "${latest_run_id}"
            exit 0
          fi

          current_body="$(gh api "repos/${REPOSITORY}/issues/${issue_number}" --jq '.body // ""')"
          if [[ "${current_body}" != "${owner_marker}"* ]]; then
            printf 'Refusing to overwrite issue #%s because its ownership marker is absent.\n' \
              "${issue_number}" >&2
            exit 1
          fi

          run_json="${RUNNER_TEMP}/run.json"
          jobs_json="${RUNNER_TEMP}/jobs.json"
          artifacts_json="${RUNNER_TEMP}/artifacts.json"
          patch_json="${RUNNER_TEMP}/patch.json"

          # Re-fetch canonical state rather than trusting a possibly stale event payload.
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" > "${run_json}"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
            > "${jobs_json}"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            > "${artifacts_json}"

          export ISSUE_NUMBER="${issue_number}"
          export ISSUE_TITLE="${issue_title}"
          export HEADING="${heading}"
          export MONITORED_BRANCH="${monitored_branch}"

          python3 - "${run_json}" "${jobs_json}" "${artifacts_json}" "${patch_json}" <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          from pathlib import Path

          run_path, jobs_path, artifacts_path, patch_path = map(Path, sys.argv[1:])
          run = json.loads(run_path.read_text(encoding="utf-8"))
          job_pages = json.loads(jobs_path.read_text(encoding="utf-8"))
          artifact_pages = json.loads(artifacts_path.read_text(encoding="utf-8"))

          if not isinstance(run, dict):
              raise RuntimeError("malformed workflow-run response")
          if not isinstance(job_pages, list) or not all(isinstance(page, dict) for page in job_pages):
              raise RuntimeError("malformed paginated jobs response")
          if not isinstance(artifact_pages, list) or not all(isinstance(page, dict) for page in artifact_pages):
              raise RuntimeError("malformed paginated artifacts response")

          raw_jobs = []
          for page in job_pages:
              page_jobs = page.get("jobs")
              if not isinstance(page_jobs, list):
                  raise RuntimeError("jobs page missing jobs array")
              raw_jobs.extend(page_jobs)

          raw_artifacts = []
          for page in artifact_pages:
              page_artifacts = page.get("artifacts")
              if not isinstance(page_artifacts, list):
                  raise RuntimeError("artifacts page missing artifacts array")
              raw_artifacts.extend(page_artifacts)

          branch = os.environ["MONITORED_BRANCH"]
          if run.get("head_branch") != branch:
              raise RuntimeError("re-fetched run does not match monitored branch")

          abnormal = {
              "failure",
              "cancelled",
              "timed_out",
              "action_required",
              "startup_failure",
              "stale",
          }
          jobs = []
          problem_jobs = []
          problem_steps = []
          active_steps = []

          for raw_job in raw_jobs:
              if not isinstance(raw_job, dict):
                  raise RuntimeError("non-object job")
              raw_steps = raw_job.get("steps") or []
              if not isinstance(raw_steps, list):
                  raise RuntimeError(f'job {raw_job.get("id")} has malformed steps')

              steps = []
              for raw_step in raw_steps:
                  if not isinstance(raw_step, dict):
                      raise RuntimeError(f'job {raw_job.get("id")} contains a non-object step')
                  step = {
                      "number": raw_step.get("number"),
                      "name": raw_step.get("name"),
                      "status": raw_step.get("status"),
                      "conclusion": raw_step.get("conclusion"),
                      "started_at": raw_step.get("started_at"),
                      "completed_at": raw_step.get("completed_at"),
                  }
                  steps.append(step)
                  indexed = {
                      "job_id": raw_job.get("id"),
                      "job": raw_job.get("name"),
                      "step_number": step["number"],
                      "step": step["name"],
                      "status": step["status"],
                      "conclusion": step["conclusion"],
                      "started_at": step["started_at"],
                      "completed_at": step["completed_at"],
                  }
                  if step["conclusion"] in abnormal:
                      problem_steps.append(indexed)
                  if step["status"] == "in_progress":
                      active_steps.append(indexed)

              job = {
                  "id": raw_job.get("id"),
                  "name": raw_job.get("name"),
                  "status": raw_job.get("status"),
                  "conclusion": raw_job.get("conclusion"),
                  "started_at": raw_job.get("started_at"),
                  "completed_at": raw_job.get("completed_at"),
                  "runner_name": raw_job.get("runner_name"),
                  "runner_group_name": raw_job.get("runner_group_name"),
                  "steps": steps,
              }
              jobs.append(job)
              if job["conclusion"] in abnormal:
                  problem_jobs.append({key: job[key] for key in ("id", "name", "status", "conclusion")})

          artifacts = []
          for raw_artifact in raw_artifacts:
              if not isinstance(raw_artifact, dict):
                  raise RuntimeError("non-object artifact")
              artifacts.append(
                  {
                      "id": raw_artifact.get("id"),
                      "name": raw_artifact.get("name"),
                      "size_in_bytes": raw_artifact.get("size_in_bytes"),
                      "expired": raw_artifact.get("expired"),
                      "created_at": raw_artifact.get("created_at"),
                      "expires_at": raw_artifact.get("expires_at"),
                  }
              )

          status = run.get("status") or "unknown"
          workflow_name = run.get("name")
          workflow_conclusion = run.get("conclusion")

          def job_executed(job):
              return job["status"] != "completed" or job["conclusion"] not in {None, "skipped"}

          if workflow_name == "Android signed release":
              gate_names = {
                  "Non-production signed APK/AAB dry run",
                  "Publish Android dry-run status",
                  "Publish blocked tag release status",
                  "Validate production tag before environment approval",
                  "Build, verify, attest, and publish production Android artifacts",
                  "Publish production Android release status",
              }
              gate_jobs = [job for job in jobs if job["name"] in gate_names]
              executed = any(job_executed(job) for job in gate_jobs)
              if any(job_executed(job) for job in gate_jobs if job["name"] == "Non-production signed APK/AAB dry run"):
                  scope = "dry_run"
              elif any(job_executed(job) for job in gate_jobs if job["name"] in {
                  "Validate production tag before environment approval",
                  "Build, verify, attest, and publish production Android artifacts",
                  "Publish production Android release status",
              }):
                  scope = "production"
              elif any(job_executed(job) for job in gate_jobs if job["name"] == "Publish blocked tag release status"):
                  scope = "tag_blocked"
              else:
                  scope = "metadata_only" if status == "completed" else "pending"
          elif workflow_name == "CI":
              core_names = {"Lint", "Test (Linux)", "Test (macOS)", "Android"}
              release_names = {"Docker real-data-path E2E", "Android emulator real-data-path E2E"}
              gate_jobs = [
                  job for job in jobs
                  if job["name"] in core_names
                  or job["name"] in release_names
                  or job["name"].startswith("Release artifacts (")
              ]
              executed = any(job_executed(job) for job in gate_jobs)
              if any(job_executed(job) for job in gate_jobs if job["name"] in release_names or job["name"].startswith("Release artifacts (")):
                  scope = "release_candidate"
              elif any(job_executed(job) for job in gate_jobs if job["name"] in core_names):
                  scope = "path_required"
              else:
                  scope = "metadata_only" if status == "completed" else "pending"
          else:
              gate_jobs = jobs
              executed = any(job_executed(job) for job in gate_jobs)
              scope = "focused" if executed else ("metadata_only" if status == "completed" else "pending")

          not_run = status == "completed" and not executed
          conclusion = "not_run" if not_run else (workflow_conclusion or "pending")
          observed = dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z")
          jobs_data_state = (
              "available" if jobs else
              "unavailable" if status == "completed" else
              "pending_or_unavailable"
          )

          payload = {
              "schema_version": 4,
              "publisher": {
                  "workflow_file": ".github/workflows/publish-ci-status-issues.yml",
                  "issue_number": int(os.environ["ISSUE_NUMBER"]),
                  "monitored_branch": branch,
              },
              "publisher_observed_at": observed,
              "workflow": {
                  "name": workflow_name,
                  "workflow_id": run.get("workflow_id"),
                  "workflow_path": run.get("path"),
                  "run_id": run.get("id"),
                  "run_number": run.get("run_number"),
                  "run_attempt": run.get("run_attempt"),
                  "run_url": run.get("html_url"),
                  "event": run.get("event"),
                  "status": status,
                  "conclusion": conclusion,
                  "workflow_conclusion": workflow_conclusion,
                  "executed": executed,
                  "scope": scope,
                  "head_branch": run.get("head_branch"),
                  "head_sha": run.get("head_sha"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
              },
              "jobs_data_state": jobs_data_state,
              "problem_jobs": problem_jobs,
              "problem_steps": problem_steps,
              "active_steps": active_steps,
              "jobs": jobs,
              "artifacts": artifacts,
              "details_compacted": False,
              "compaction_reason": None,
          }

          def safe(value):
              return str(value).replace("`", "'").replace("\r", " ").replace("\n", " ")

          def summarize_jobs(items):
              if not items:
                  return "None"
              return ", ".join(f'{safe(item["name"])} (`{safe(item["id"])}`)' for item in items)

          def summarize_steps(items):
              if not items:
                  return "None"
              return ", ".join(
                  f'{safe(item["job"])} / {safe(item["step"])} — `{safe(item["conclusion"] or item["status"])}`'
                  for item in items
              )

          def summarize_artifacts(items):
              if not items:
                  return "None"
              return ", ".join(f'{safe(item["name"])} (`{safe(item["id"])}`)' for item in items)

          def render_body():
              return "\n".join(
                  [
                      "<!-- maintained by publish-ci-status-issues.yml -->",
                      f'# {os.environ["HEADING"]}',
                      "",
                      f'- **Status:** `{safe(status)}`',
                      f'- **Conclusion:** `{safe(conclusion)}`',
                      f'- **Workflow conclusion:** `{safe(workflow_conclusion or "pending")}`',
                      f'- **Executed:** `{str(executed).lower()}`',
                      f'- **Scope:** `{safe(scope)}`',
                      f'- **Run:** [{safe(run.get("id"))}]({run.get("html_url")})',
                      f'- **Attempt:** `{safe(run.get("run_attempt"))}`',
                      f'- **Commit:** `{safe(run.get("head_sha"))}`',
                      f'- **Branch/event:** `{safe(run.get("head_branch"))}` / `{safe(run.get("event"))}`',
                      f'- **Jobs:** `{len(jobs)}`',
                      f'- **Problem jobs:** {summarize_jobs(problem_jobs)}',
                      f'- **Problem steps:** {summarize_steps(problem_steps)}',
                      f'- **Active steps:** {summarize_steps(active_steps)}',
                      f'- **Artifacts:** {summarize_artifacts(artifacts)}',
                      f'- **Observed:** `{safe(observed)}`',
                      "",
                      "## Machine-readable status",
                      "",
                      "```json",
                      json.dumps(payload, indent=2, sort_keys=True),
                      "```",
                      "",
                      "This issue is overwritten whenever the latest applicable run changes state. It is not a historical log.",
                  ]
              )

          body = render_body()
          if len(body.encode("utf-8")) > 60_000:
              problem_job_ids = {item["id"] for item in problem_jobs}
              for job in payload["jobs"]:
                  if job["id"] not in problem_job_ids:
                      job["step_count"] = len(job["steps"])
                      job["steps"] = []
                      job["steps_compacted"] = True
              payload["details_compacted"] = True
              payload["compaction_reason"] = "issue_body_size_limit"
              body = render_body()

          if len(body.encode("utf-8")) > 60_000:
              problem_numbers = {
                  (item["job_id"], item["step_number"])
                  for item in problem_steps
              }
              for job in payload["jobs"]:
                  original_steps = job["steps"]
                  if original_steps:
                      job["step_count"] = len(original_steps)
                      job["steps"] = [
                          step for step in original_steps
                          if (job["id"], step["number"]) in problem_numbers
                      ]
                      job["steps_compacted"] = True
              payload["details_compacted"] = True
              payload["compaction_reason"] = "issue_body_size_limit_preserving_problem_steps"
              body = render_body()

          if len(body.encode("utf-8")) > 60_000:
              raise RuntimeError("status issue body exceeds safe size limit after deterministic compaction")

          patch_path.write_text(
              json.dumps(
                  {
                      "title": os.environ["ISSUE_TITLE"],
                      "body": body,
                      "state": "open",
                  }
              ),
              encoding="utf-8",
          )
          PY

          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --input "${patch_json}" \
            >/dev/null
          printf 'Published run %s for %s on %s to issue #%s.\n' \
            "${RUN_ID}" "${WORKFLOW_NAME}" "${monitored_branch}" "${ISSUE_NUMBER}"
