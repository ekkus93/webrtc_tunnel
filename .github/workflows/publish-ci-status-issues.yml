name: Publish CI Status Issues

on:
  workflow_run:
    workflows:
      - CI
      - RC diagnostics
      - FIX9 broker-secret instrumentation
      - Android signed release
    types:
      - requested
      - in_progress
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: publish-ci-status-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish latest workflow state
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Update authoritative status issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          EVENT_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          case "${EVENT_WORKFLOW_NAME}" in
            "CI")
              issue_number="1"
              issue_title="CI Status: Main Workflow"
              issue_heading="Latest Main CI Workflow"
              monitored_branch="master"
              ;;
            "RC diagnostics")
              issue_number="2"
              issue_title="CI Status: RC Diagnostics"
              issue_heading="Latest RC Diagnostics"
              monitored_branch="master"
              ;;
            "FIX9 broker-secret instrumentation")
              issue_number="3"
              issue_title="CI Status: Broker Secret Instrumentation"
              issue_heading="Latest Broker Secret Instrumentation"
              monitored_branch="master"
              ;;
            "Android signed release")
              issue_number="6"
              issue_title="CI Status: Android Signed Release — master"
              issue_heading="Latest Android Signed Release — master"
              monitored_branch="master"
              ;;
            *)
              printf 'Unsupported workflow name: %s\n' "${EVENT_WORKFLOW_NAME}" >&2
              exit 1
              ;;
          esac

          if [[ "${EVENT_HEAD_BRANCH}" != "${monitored_branch}" ]]; then
            printf 'Ignoring workflow %s run %s for unrelated branch %s; monitored branch is %s.\n' \
              "${EVENT_WORKFLOW_NAME}" "${EVENT_RUN_ID}" "${EVENT_HEAD_BRANCH}" "${monitored_branch}"
            exit 0
          fi

          latest_run_id="$(
            gh api \
              "repos/${REPOSITORY}/actions/workflows/${EVENT_WORKFLOW_ID}/runs?branch=${monitored_branch}&per_page=1" \
              --jq '.workflow_runs[0].id // empty'
          )"
          if [[ -z "${latest_run_id}" ]]; then
            printf 'No runs are visible yet for workflow %s on branch %s; a later state event will retry publication.\n' \
              "${EVENT_WORKFLOW_NAME}" "${monitored_branch}"
            exit 0
          fi
          if [[ "${latest_run_id}" != "${EVENT_RUN_ID}" ]]; then
            printf 'Skipping stale state for run %s; latest %s run on %s is %s.\n' \
              "${EVENT_RUN_ID}" "${EVENT_WORKFLOW_NAME}" "${monitored_branch}" "${latest_run_id}"
            exit 0
          fi

          run_file="${RUNNER_TEMP}/ci-status-run.json"
          jobs_file="${RUNNER_TEMP}/ci-status-jobs.json"
          artifacts_file="${RUNNER_TEMP}/ci-status-artifacts.json"
          body_file="${RUNNER_TEMP}/ci-status-body.md"
          patch_file="${RUNNER_TEMP}/ci-status-issue-patch.json"

          # Re-fetch the run instead of trusting the triggering event. This prevents an older
          # in-progress publisher from overwriting a completed state for the same run.
          gh api "repos/${REPOSITORY}/actions/runs/${EVENT_RUN_ID}" > "${run_file}"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${EVENT_RUN_ID}/jobs?filter=latest&per_page=100" \
            > "${jobs_file}"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${EVENT_RUN_ID}/artifacts?per_page=100" \
            > "${artifacts_file}"

          export ISSUE_NUMBER="${issue_number}"
          export ISSUE_TITLE="${issue_title}"
          export ISSUE_HEADING="${issue_heading}"
          export MONITORED_BRANCH="${monitored_branch}"

          python3 - "${run_file}" "${jobs_file}" "${artifacts_file}" "${body_file}" "${patch_file}" <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          from pathlib import Path

          run_path, jobs_path, artifacts_path, body_path, patch_path = map(Path, sys.argv[1:])
          run = json.loads(run_path.read_text(encoding="utf-8"))
          job_pages = json.loads(jobs_path.read_text(encoding="utf-8"))
          artifact_pages = json.loads(artifacts_path.read_text(encoding="utf-8"))

          if not isinstance(job_pages, list) or not all(isinstance(page, dict) for page in job_pages):
              raise RuntimeError("GitHub jobs API pagination payload is malformed")
          if not isinstance(artifact_pages, list) or not all(isinstance(page, dict) for page in artifact_pages):
              raise RuntimeError("GitHub artifacts API pagination payload is malformed")

          raw_jobs = []
          for page in job_pages:
              page_jobs = page.get("jobs")
              if not isinstance(page_jobs, list):
                  raise RuntimeError("GitHub jobs API page is missing a jobs array")
              raw_jobs.extend(page_jobs)

          raw_artifacts = []
          for page in artifact_pages:
              page_artifacts = page.get("artifacts")
              if not isinstance(page_artifacts, list):
                  raise RuntimeError("GitHub artifacts API page is missing an artifacts array")
              raw_artifacts.extend(page_artifacts)

          monitored_branch = os.environ["MONITORED_BRANCH"]
          if run.get("head_branch") != monitored_branch:
              raise RuntimeError(
                  f'Fetched run branch {run.get("head_branch")!r} does not match monitored branch {monitored_branch!r}'
              )

          bad_conclusions = {
              "action_required",
              "cancelled",
              "failure",
              "stale",
              "startup_failure",
              "timed_out",
          }
          jobs = []
          failed_jobs = []
          failed_steps = []
          active_steps = []

          for raw_job in raw_jobs:
              if not isinstance(raw_job, dict):
                  raise RuntimeError("GitHub jobs API returned a non-object job")

              steps = []
              job_failed_steps = []
              job_active_steps = []
              raw_steps = raw_job.get("steps") or []
              if not isinstance(raw_steps, list):
                  raise RuntimeError(f'Job {raw_job.get("id")} has a malformed steps value')

              for raw_step in raw_steps:
                  if not isinstance(raw_step, dict):
                      raise RuntimeError(f'Job {raw_job.get("id")} contains a non-object step')
                  step = {
                      "number": raw_step.get("number"),
                      "name": raw_step.get("name"),
                      "status": raw_step.get("status"),
                      "conclusion": raw_step.get("conclusion"),
                      "started_at": raw_step.get("started_at"),
                      "completed_at": raw_step.get("completed_at"),
                  }
                  steps.append(step)
                  if step["conclusion"] in bad_conclusions:
                      item = {
                          "job_id": raw_job.get("id"),
                          "job": raw_job.get("name"),
                          "step_number": step["number"],
                          "step": step["name"],
                          "conclusion": step["conclusion"],
                          "status": step["status"],
                          "started_at": step["started_at"],
                          "completed_at": step["completed_at"],
                      }
                      failed_steps.append(item)
                      job_failed_steps.append(step)
                  if step["status"] == "in_progress":
                      item = {
                          "job_id": raw_job.get("id"),
                          "job": raw_job.get("name"),
                          "step_number": step["number"],
                          "step": step["name"],
                          "conclusion": step["conclusion"],
                          "status": step["status"],
                          "started_at": step["started_at"],
                          "completed_at": step["completed_at"],
                      }
                      active_steps.append(item)
                      job_active_steps.append(step)

              conclusion = raw_job.get("conclusion")
              if conclusion in bad_conclusions:
                  failed_jobs.append(
                      {
                          "id": raw_job.get("id"),
                          "name": raw_job.get("name"),
                          "status": raw_job.get("status"),
                          "conclusion": conclusion,
                      }
                  )

              jobs.append(
                  {
                      "id": raw_job.get("id"),
                      "name": raw_job.get("name"),
                      "status": raw_job.get("status"),
                      "conclusion": conclusion,
                      "started_at": raw_job.get("started_at"),
                      "completed_at": raw_job.get("completed_at"),
                      "runner_name": raw_job.get("runner_name"),
                      "runner_group_name": raw_job.get("runner_group_name"),
                      "steps": steps,
                      "failed_steps": job_failed_steps,
                      "active_steps": job_active_steps,
                  }
              )

          artifacts = [
              {
                  "id": artifact.get("id"),
                  "name": artifact.get("name"),
                  "size_in_bytes": artifact.get("size_in_bytes"),
                  "expired": artifact.get("expired"),
                  "created_at": artifact.get("created_at"),
                  "expires_at": artifact.get("expires_at"),
              }
              for artifact in raw_artifacts
              if isinstance(artifact, dict)
          ]
          if len(artifacts) != len(raw_artifacts):
              raise RuntimeError("GitHub artifacts API returned a non-object artifact")

          status = run.get("status") or "unknown"
          workflow_conclusion = run.get("conclusion")
          all_jobs_skipped = bool(jobs) and all(job["conclusion"] == "skipped" for job in jobs)
          no_jobs_completed = status == "completed" and not jobs
          not_run = status == "completed" and (all_jobs_skipped or no_jobs_completed)
          effective_conclusion = "not_run" if not_run else (workflow_conclusion or "pending")

          def job_was_required(job: dict | None) -> bool:
              if job is None:
                  return False
              return job["status"] != "completed" or job["conclusion"] not in {None, "skipped"}

          if run.get("name") != "CI":
              scope = "focused"
          elif not jobs:
              scope = "pending" if status != "completed" else "metadata_only"
          else:
              jobs_by_name = {job["name"]: job for job in jobs}
              release_names = {
                  "Docker real-data-path E2E",
                  "Android emulator real-data-path E2E",
              }
              core_names = {
                  "Lint",
                  "Test (Linux)",
                  "Test (macOS)",
                  "Android",
              }
              if any(job_was_required(jobs_by_name.get(name)) for name in release_names):
                  scope = "release_candidate"
              elif any(job_was_required(jobs_by_name.get(name)) for name in core_names):
                  scope = "path_required"
              else:
                  scope = "metadata_only"

          observed_at = dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z")
          payload = {
              "schema_version": 3,
              "publisher": {
                  "workflow_file": ".github/workflows/publish-ci-status-issues.yml",
                  "issue_number": int(os.environ["ISSUE_NUMBER"]),
                  "monitored_branch": monitored_branch,
              },
              "publisher_observed_at": observed_at,
              "workflow": run.get("name"),
              "workflow_id": run.get("workflow_id"),
              "workflow_path": run.get("path"),
              "scope": scope,
              "run_id": run.get("id"),
              "run_number": run.get("run_number"),
              "run_attempt": run.get("run_attempt"),
              "run_url": run.get("html_url"),
              "status": status,
              "conclusion": effective_conclusion,
              "workflow_conclusion": workflow_conclusion,
              "executed": not not_run,
              "jobs_data_state": "available" if jobs else ("pending_or_unavailable" if status != "completed" else "unavailable"),
              "event": run.get("event"),
              "head_branch": run.get("head_branch"),
              "head_sha": run.get("head_sha"),
              "created_at": run.get("created_at"),
              "updated_at": run.get("updated_at"),
              "failed_jobs": failed_jobs,
              "failed_steps": failed_steps,
              "active_steps": active_steps,
              "artifacts": artifacts,
              "jobs": jobs,
              "details_compacted": false,
              "compaction_reason": null,
          }

          def inline_code(value: object) -> str:
              return str(value).replace("`", "'").replace("\r", " ").replace("\n", " ")

          def summarize_jobs(items: list[dict]) -> str:
              if not items:
                  return "None"
              return ", ".join(
                  f'{inline_code(item["name"])} (`{inline_code(item["id"])}`)' for item in items
              )

          def summarize_steps(items: list[dict]) -> str:
              if not items:
                  return "None"
              return ", ".join(
                  f'{inline_code(item["job"])} / {inline_code(item["step"])} — `{inline_code(item["conclusion"] or item["status"])}`'
                  for item in items
              )

          def summarize_artifacts(items: list[dict]) -> str:
              if not items:
                  return "None"
              return ", ".join(
                  f'{inline_code(item["name"])} (`{inline_code(item["id"])}`)' for item in items
              )

          def render_body(current_payload: dict) -> str:
              return "\n".join(
                  [
                      "<!-- maintained by publish-ci-status-issues.yml -->",
                      f'# {os.environ["ISSUE_HEADING"]}',
                      "",
                      f'- **Status:** `{inline_code(status)}`',
                      f'- **Conclusion:** `{inline_code(effective_conclusion)}`',
                      f'- **Workflow conclusion:** `{inline_code(workflow_conclusion or "pending")}`',
                      f'- **Scope:** `{inline_code(scope)}`',
                      f'- **Executed:** `{str(not not_run).lower()}`',
                      f'- **Run:** [{inline_code(run.get("id"))}]({run.get("html_url")})',
                      f'- **Run number / attempt:** `{inline_code(run.get("run_number"))}` / `{inline_code(run.get("run_attempt"))}`',
                      f'- **Commit:** `{inline_code(run.get("head_sha"))}`',
                      f'- **Branch/event:** `{inline_code(run.get("head_branch"))}` / `{inline_code(run.get("event"))}`',
                      f'- **Jobs:** `{len(jobs)}`',
                      f'- **Failed jobs:** {summarize_jobs(failed_jobs)}',
                      f'- **Failed steps:** {summarize_steps(failed_steps)}',
                      f'- **Active steps:** {summarize_steps(active_steps)}',
                      f'- **Artifacts:** {summarize_artifacts(artifacts)}',
                      f'- **Source updated:** `{inline_code(run.get("updated_at"))}`',
                      f'- **Publisher observed:** `{inline_code(observed_at)}`',
                      "",
                      "## Machine-readable status",
                      "",
                      "```json",
                      json.dumps(current_payload, indent=2, sort_keys=True),
                      "```",
                      "",
                      "This issue is overwritten whenever the latest applicable run changes state; it is not a historical log.",
                  ]
              )

          body = render_body(payload)
          if len(body.encode("utf-8")) > 60_000:
              for job in payload["jobs"]:
                  if job["conclusion"] not in bad_conclusions and not job["failed_steps"]:
                      job["step_count"] = len(job["steps"])
                      job["steps"] = []
                      job["steps_compacted"] = true
              payload["details_compacted"] = true
              payload["compaction_reason"] = "issue_body_size_limit"
              body = render_body(payload)

          if len(body.encode("utf-8")) > 60_000:
              raise RuntimeError("CI status issue body exceeds the safe size limit after deterministic compaction")

          body_path.write_text(body + "\n", encoding="utf-8")
          patch_path.write_text(
              json.dumps(
                  {
                      "title": os.environ["ISSUE_TITLE"],
                      "body": body,
                      "state": "open",
                  }
              ),
              encoding="utf-8",
          )
          PY

          gh api \
            --method PATCH \
            "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --input "${patch_file}" \
            >/dev/null

          printf 'Published canonical run %s state for %s on %s to issue #%s.\n' \
            "${EVENT_RUN_ID}" "${EVENT_WORKFLOW_NAME}" "${monitored_branch}" "${ISSUE_NUMBER}"
