name: Publish CI Status Issues

on:
  workflow_run:
    workflows:
      - CI
      - RC diagnostics
      - FIX9 broker-secret instrumentation
      - Android signed release
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: publish-ci-status-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish latest workflow state
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Update authoritative status issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          case "${WORKFLOW_NAME}" in
            "CI") issue_number=1; issue_title="CI Status: Main Workflow"; heading="Latest Main CI Workflow" ;;
            "RC diagnostics") issue_number=2; issue_title="CI Status: RC Diagnostics"; heading="Latest RC Diagnostics" ;;
            "FIX9 broker-secret instrumentation") issue_number=3; issue_title="CI Status: Broker Secret Instrumentation"; heading="Latest Broker Secret Instrumentation" ;;
            "Android signed release") issue_number=6; issue_title="CI Status: Android Signed Release — master"; heading="Latest Android Signed Release — master" ;;
            *) printf 'Unsupported workflow: %s\n' "${WORKFLOW_NAME}" >&2; exit 1 ;;
          esac
          monitored_branch=master

          if [[ "${HEAD_BRANCH}" != "${monitored_branch}" ]]; then
            printf 'Ignoring %s run %s on unrelated branch %s.\n' "${WORKFLOW_NAME}" "${RUN_ID}" "${HEAD_BRANCH}"
            exit 0
          fi

          latest_run_id="$(gh api \
            "repos/${REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?branch=${monitored_branch}&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [[ -z "${latest_run_id}" ]]; then
            printf 'No visible %s run on %s yet.\n' "${WORKFLOW_NAME}" "${monitored_branch}"
            exit 0
          fi
          if [[ "${latest_run_id}" != "${RUN_ID}" ]]; then
            printf 'Skipping stale run %s; latest applicable run is %s.\n' "${RUN_ID}" "${latest_run_id}"
            exit 0
          fi

          run_json="${RUNNER_TEMP}/run.json"
          jobs_json="${RUNNER_TEMP}/jobs.json"
          artifacts_json="${RUNNER_TEMP}/artifacts.json"
          patch_json="${RUNNER_TEMP}/patch.json"

          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" > "${run_json}"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" > "${jobs_json}"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > "${artifacts_json}"

          export ISSUE_NUMBER="${issue_number}"
          export ISSUE_TITLE="${issue_title}"
          export HEADING="${heading}"
          export MONITORED_BRANCH="${monitored_branch}"

          python3 - "${run_json}" "${jobs_json}" "${artifacts_json}" "${patch_json}" <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          from pathlib import Path

          run_path, jobs_path, artifacts_path, patch_path = map(Path, sys.argv[1:])
          run = json.loads(run_path.read_text())
          job_pages = json.loads(jobs_path.read_text())
          artifact_pages = json.loads(artifacts_path.read_text())

          if not isinstance(job_pages, list) or not all(isinstance(page, dict) for page in job_pages):
              raise RuntimeError("malformed paginated jobs response")
          if not isinstance(artifact_pages, list) or not all(isinstance(page, dict) for page in artifact_pages):
              raise RuntimeError("malformed paginated artifacts response")

          raw_jobs = []
          for page in job_pages:
              jobs = page.get("jobs")
              if not isinstance(jobs, list):
                  raise RuntimeError("jobs page missing jobs array")
              raw_jobs.extend(jobs)

          raw_artifacts = []
          for page in artifact_pages:
              artifacts = page.get("artifacts")
              if not isinstance(artifacts, list):
                  raise RuntimeError("artifacts page missing artifacts array")
              raw_artifacts.extend(artifacts)

          branch = os.environ["MONITORED_BRANCH"]
          if run.get("head_branch") != branch:
              raise RuntimeError("re-fetched run does not match monitored branch")

          abnormal = {"failure", "cancelled", "timed_out", "action_required", "startup_failure", "stale"}
          jobs = []
          problem_jobs = []
          problem_steps = []
          active_steps = []

          for raw_job in raw_jobs:
              if not isinstance(raw_job, dict):
                  raise RuntimeError("non-object job")
              steps = []
              for raw_step in raw_job.get("steps") or []:
                  if not isinstance(raw_step, dict):
                      raise RuntimeError("non-object step")
                  step = {
                      "number": raw_step.get("number"),
                      "name": raw_step.get("name"),
                      "status": raw_step.get("status"),
                      "conclusion": raw_step.get("conclusion"),
                      "started_at": raw_step.get("started_at"),
                      "completed_at": raw_step.get("completed_at"),
                  }
                  steps.append(step)
                  indexed = {"job_id": raw_job.get("id"), "job": raw_job.get("name"), **step}
                  if step["conclusion"] in abnormal:
                      problem_steps.append(indexed)
                  if step["status"] == "in_progress":
                      active_steps.append(indexed)

              job = {
                  "id": raw_job.get("id"),
                  "name": raw_job.get("name"),
                  "status": raw_job.get("status"),
                  "conclusion": raw_job.get("conclusion"),
                  "started_at": raw_job.get("started_at"),
                  "completed_at": raw_job.get("completed_at"),
                  "runner_name": raw_job.get("runner_name"),
                  "runner_group_name": raw_job.get("runner_group_name"),
                  "steps": steps,
              }
              jobs.append(job)
              if job["conclusion"] in abnormal:
                  problem_jobs.append({k: job[k] for k in ("id", "name", "status", "conclusion")})

          artifacts = []
          for raw in raw_artifacts:
              if not isinstance(raw, dict):
                  raise RuntimeError("non-object artifact")
              artifacts.append({
                  "id": raw.get("id"),
                  "name": raw.get("name"),
                  "size_in_bytes": raw.get("size_in_bytes"),
                  "expired": raw.get("expired"),
                  "created_at": raw.get("created_at"),
                  "expires_at": raw.get("expires_at"),
              })

          status = run.get("status") or "unknown"
          workflow_conclusion = run.get("conclusion")
          not_run = status == "completed" and (not jobs or all(j["conclusion"] == "skipped" for j in jobs))
          conclusion = "not_run" if not_run else (workflow_conclusion or "pending")
          observed = dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z")

          payload = {
              "schema_version": 3,
              "publisher": {
                  "workflow_file": ".github/workflows/publish-ci-status-issues.yml",
                  "issue_number": int(os.environ["ISSUE_NUMBER"]),
                  "monitored_branch": branch,
              },
              "workflow": {
                  "name": run.get("name"),
                  "workflow_id": run.get("workflow_id"),
                  "workflow_path": run.get("path"),
                  "run_id": run.get("id"),
                  "run_number": run.get("run_number"),
                  "run_attempt": run.get("run_attempt"),
                  "run_url": run.get("html_url"),
                  "event": run.get("event"),
                  "status": status,
                  "conclusion": conclusion,
                  "workflow_conclusion": workflow_conclusion,
                  "head_branch": run.get("head_branch"),
                  "head_sha": run.get("head_sha"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
              },
              "publisher_observed_at": observed,
              "jobs_data_state": "available" if jobs else "pending_or_unavailable",
              "problem_jobs": problem_jobs,
              "problem_steps": problem_steps,
              "active_steps": active_steps,
              "jobs": jobs,
              "artifacts": artifacts,
          }

          def safe(value):
              return str(value).replace("`", "'").replace("\r", " ").replace("\n", " ")

          def summarize(items, kind):
              if not items:
                  return "None"
              if kind == "job":
                  return ", ".join(f'{safe(x["name"])} (`{safe(x["id"])}`)' for x in items)
              if kind == "step":
                  return ", ".join(f'{safe(x["job"])} / {safe(x["name"])} — `{safe(x["conclusion"] or x["status"])}`' for x in items)
              return ", ".join(f'{safe(x["name"])} (`{safe(x["id"])}`)' for x in items)

          body = "\n".join([
              "<!-- maintained by publish-ci-status-issues.yml -->",
              f'# {os.environ["HEADING"]}',
              "",
              f'- **Status:** `{safe(status)}`',
              f'- **Conclusion:** `{safe(conclusion)}`',
              f'- **Run:** [{safe(run.get("id"))}]({run.get("html_url")})',
              f'- **Attempt:** `{safe(run.get("run_attempt"))}`',
              f'- **Commit:** `{safe(run.get("head_sha"))}`',
              f'- **Branch/event:** `{safe(run.get("head_branch"))}` / `{safe(run.get("event"))}`',
              f'- **Jobs:** `{len(jobs)}`',
              f'- **Problem jobs:** {summarize(problem_jobs, "job")}',
              f'- **Problem steps:** {summarize(problem_steps, "step")}',
              f'- **Active steps:** {summarize(active_steps, "step")}',
              f'- **Artifacts:** {summarize(artifacts, "artifact")}',
              f'- **Observed:** `{safe(observed)}`',
              "",
              "## Machine-readable status",
              "",
              "```json",
              json.dumps(payload, indent=2, sort_keys=True),
              "```",
              "",
              "This issue is overwritten whenever the latest applicable run changes state. It is not a historical log.",
          ])
          if len(body.encode()) > 60000:
              raise RuntimeError("status issue body exceeds safe size limit")

          patch_path.write_text(json.dumps({
              "title": os.environ["ISSUE_TITLE"],
              "body": body,
              "state": "open",
          }))
          PY

          gh api --method PATCH "repos/${REPOSITORY}/issues/${ISSUE_NUMBER}" --input "${patch_json}" >/dev/null
          printf 'Published run %s for %s on %s to issue #%s.\n' \
            "${RUN_ID}" "${WORKFLOW_NAME}" "${monitored_branch}" "${ISSUE_NUMBER}"
