name: Run Android AAB signing fix

on:
  push:
    branches: [master]
    paths:
      - .github/android-aab-signing-fix-trigger

concurrency:
  group: run-android-aab-signing-fix
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  statuses: write

jobs:
  apply:
    name: Execute guarded explicit AAB signing migration
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending migration status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=ci/android-aab-signing-migration \
            -f description='guarded explicit AAB signing migration is running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Check out exact trigger commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Extract and compile the audited migration payload
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /base64 --decode <<.MIGRATION_PAYLOAD./ { capture=1; next }
            capture && /^[[:space:]]*MIGRATION_PAYLOAD$/ { exit }
            capture { sub(/^[[:space:]]+/, ""); print }
          ' .github/workflows/apply-android-aab-signing-fix.yml | \
            base64 --decode | gzip --decompress > "$RUNNER_TEMP/apply-android-aab-signing-fix.py"
          chmod 0500 "$RUNNER_TEMP/apply-android-aab-signing-fix.py"
          python3 -m py_compile "$RUNNER_TEMP/apply-android-aab-signing-fix.py"
      - name: Require current master and apply migration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          remote=$(git ls-remote origin refs/heads/master | cut -f1)
          [[ "$remote" == "$GITHUB_SHA" ]] || {
            echo "master advanced before migration: expected=$GITHUB_SHA actual=$remote" >&2
            exit 1
          }
          python3 "$RUNNER_TEMP/apply-android-aab-signing-fix.py"
          rm -f .github/workflows/run-android-aab-signing-fix.yml
          rm -f .github/android-aab-signing-fix-trigger
      - name: Compile and run release contract tests
        run: |
          python3 -m py_compile scripts/android_release.py scripts/android_bundle_release.py scripts/test_android_release.py scripts/test_android_bundle_release.py
          PYTHONPATH=scripts python3 -m unittest -v scripts/test_android_release.py scripts/test_android_bundle_release.py
      - name: Validate final migration invariants
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path) }' \
            .github/workflows/ci.yml .github/workflows/android-release.yml \
            .github/actions/setup-android-release/action.yml
          git diff --check
          test ! -e .github/workflows/android-release-build-diagnostic.yml
          test ! -e .github/workflows/apply-android-aab-signing-fix.yml
          test ! -e .github/workflows/run-android-aab-signing-fix.yml
          test ! -e .github/android-aab-signing-fix-trigger
          grep -Fq 'app-release-signed.aab' .github/workflows/android-release.yml
          ! grep -Fq ':app:assembleRelease :app:bundleRelease' .github/workflows/android-release.yml
          grep -Fq 'BUNDLETOOL_SHA256' .github/actions/setup-android-release/action.yml
          ! grep -Fq 'android_release.py verify-artifacts' .github/workflows/android-release.yml
          ! grep -Fq '|| true' .github/workflows/android-release.yml
      - name: Commit one atomic final migration
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'migration produced no changes' >&2; exit 1; }
          git commit -m 'fix(android): explicitly sign and validate app bundle'
          new_sha=$(git rev-parse HEAD)
          remote=$(git ls-remote origin refs/heads/master | cut -f1)
          [[ "$remote" == "$GITHUB_SHA" ]] || {
            echo "master advanced before final push: expected=$GITHUB_SHA actual=$remote" >&2
            exit 1
          }
          git push origin HEAD:master
          echo "sha=$new_sha" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact-SHA full CI and Android release dry run
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref master \
            -f expected_sha="$NEW_SHA" -f full_signoff=true
          gh workflow run android-release.yml --repo "$GITHUB_REPOSITORY" --ref master \
            -f expected_sha="$NEW_SHA"
          echo "dispatched exact-SHA validation for $NEW_SHA"
      - name: Publish terminal migration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='explicit AAB signing migration committed and exact-SHA validation dispatched'
          else
            state=failure
            description="explicit AAB signing migration ended with $JOB_STATUS"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=ci/android-aab-signing-migration \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [[ "$state" == success ]]
