name: Run Android AAB signing fix

on:
  push:
    branches: [master]
    paths:
      - .github/android-aab-signing-fix-trigger

concurrency:
  group: run-android-aab-signing-fix
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  apply:
    name: Execute guarded explicit AAB signing migration
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending migration status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=ci/android-aab-signing-migration \
            -f description='guarded explicit AAB signing migration is running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Check out exact trigger commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Extract and compile the audited migration payload
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /base64 --decode <<.MIGRATION_PAYLOAD./ { capture=1; next }
            capture && /^[[:space:]]*MIGRATION_PAYLOAD$/ { exit }
            capture { sub(/^[[:space:]]+/, ""); print }
          ' .github/workflows/apply-android-aab-signing-fix.yml | \
            base64 --decode | gzip --decompress > "$RUNNER_TEMP/apply-android-aab-signing-fix.py"
          chmod 0500 "$RUNNER_TEMP/apply-android-aab-signing-fix.py"
          python3 -m py_compile "$RUNNER_TEMP/apply-android-aab-signing-fix.py"
      - name: Require current master and apply migration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          remote=$(git ls-remote origin refs/heads/master | cut -f1)
          [[ "$remote" == "$GITHUB_SHA" ]] || {
            echo "master advanced before migration: expected=$GITHUB_SHA actual=$remote" >&2
            exit 1
          }
          python3 "$RUNNER_TEMP/apply-android-aab-signing-fix.py"
          rm -f .github/workflows/run-android-aab-signing-fix.yml
          rm -f .github/android-aab-signing-fix-trigger
      - name: Compile and run release contract tests
        run: |
          python3 -m py_compile scripts/android_release.py scripts/android_bundle_release.py scripts/test_android_release.py scripts/test_android_bundle_release.py
          PYTHONPATH=scripts python3 -m unittest -v scripts/test_android_release.py scripts/test_android_bundle_release.py
      - name: Validate final migration invariants
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path) }' \
            .github/workflows/ci.yml .github/workflows/android-release.yml \
            .github/actions/setup-android-release/action.yml
          git diff --check
          test ! -e .github/workflows/android-release-build-diagnostic.yml
          test ! -e .github/workflows/apply-android-aab-signing-fix.yml
          test ! -e .github/workflows/run-android-aab-signing-fix.yml
          test ! -e .github/android-aab-signing-fix-trigger
          grep -Fq 'app-release-signed.aab' .github/workflows/android-release.yml
          ! grep -Fq ':app:assembleRelease :app:bundleRelease' .github/workflows/android-release.yml
          grep -Fq 'BUNDLETOOL_SHA256' .github/actions/setup-android-release/action.yml
          ! grep -Fq 'android_release.py verify-artifacts' .github/workflows/android-release.yml
          ! grep -Fq '|| true' .github/workflows/android-release.yml
      - name: Package an exact checksummed migration tree
        id: package
        shell: bash
        run: |
          set -euo pipefail
          find scripts -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git add -A
          git diff --cached --quiet && { echo 'migration produced no changes' >&2; exit 1; }
          output="$RUNNER_TEMP/android-aab-signing-migration-${GITHUB_SHA}.zip"
          OUTPUT_PATH="$output" python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath

          raw = subprocess.check_output(
              ["git", "diff", "--cached", "--name-status", "--no-renames", "-z"]
          ).split(b"\0")
          if raw and raw[-1] == b"":
              raw.pop()
          if len(raw) % 2:
              raise SystemExit("unexpected git name-status record shape")

          upserts = []
          deletions = []
          records = []
          for offset in range(0, len(raw), 2):
              status = raw[offset].decode("ascii")
              path = raw[offset + 1].decode("utf-8")
              pure = PurePosixPath(path)
              if pure.is_absolute() or ".." in pure.parts or path != pure.as_posix():
                  raise SystemExit(f"unsafe migration path: {path}")
              if status == "D":
                  deletions.append(path)
                  continue
              if status not in {"A", "M", "T"}:
                  raise SystemExit(f"unsupported migration status {status}: {path}")
              index_line = subprocess.check_output(
                  ["git", "ls-files", "-s", "--", path], text=True
              ).strip()
              mode = index_line.split()[0]
              if mode not in {"100644", "100755"}:
                  raise SystemExit(f"unsupported migration mode {mode}: {path}")
              data = Path(path).read_bytes()
              record = {
                  "path": path,
                  "mode": mode,
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              }
              upserts.append(record)
              records.append((path, data))

          base_tree_sha = subprocess.check_output(
              ["git", "rev-parse", f"{os.environ['GITHUB_SHA']}^{{tree}}"], text=True
          ).strip()
          manifest = {
              "schema_version": 1,
              "base_sha": os.environ["GITHUB_SHA"],
              "base_tree_sha": base_tree_sha,
              "upserts": sorted(upserts, key=lambda item: item["path"]),
              "deletions": sorted(deletions),
          }
          output = Path(os.environ["OUTPUT_PATH"])
          with zipfile.ZipFile(output, "x", compression=zipfile.ZIP_DEFLATED) as archive:
              for path, data in sorted(records):
                  archive.writestr(f"files/{path}", data)
              archive.writestr(
                  "manifest.json",
                  json.dumps(manifest, indent=2, sort_keys=True).encode("utf-8") + b"\n",
              )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
          echo "path=$output" >> "$GITHUB_OUTPUT"
      - name: Upload validated migration tree
        uses: actions/upload-artifact@v7
        with:
          name: android-aab-signing-migration-${{ github.sha }}
          path: ${{ steps.package.outputs.path }}
          retention-days: 3
          if-no-files-found: error
      - name: Publish terminal migration status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='validated explicit AAB signing migration tree is ready'
          else
            state=failure
            description="explicit AAB signing migration ended with $JOB_STATUS"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=ci/android-aab-signing-migration \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [[ "$state" == success ]]
