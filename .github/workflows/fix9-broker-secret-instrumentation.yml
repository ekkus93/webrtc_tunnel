name: FIX9 broker-secret instrumentation

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact master SHA this instrumentation run must validate
        required: false
        default: ""
        type: string

concurrency:
  group: fix9-broker-secret-instrumentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  broker-secret-instrumentation:
    name: Broker secret permission instrumentation
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-signoff]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Validate exact requested SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'expected_sha must be a full lowercase commit SHA\n' >&2
            exit 1
          fi
          if [[ "${EXPECTED_SHA}" != "${GITHUB_SHA}" ]]; then
            printf 'workflow dispatch SHA mismatch: expected=%s event=%s\n' \
              "${EXPECTED_SHA}" "${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK components
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android Rust JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build -p p2p-mobile --release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run broker-secret permission instrumentation test
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./android/gradlew -p android --no-daemon connectedDebugAndroidTest -PskipRustBuild=true -Pandroid.testInstrumentationRunnerArguments.class=com.phillipchin.webrtctunnel.data.BrokerSecretRepositoryInstrumentedTest

      - name: Publish broker-secret instrumentation status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TARGET_SHA: ${{ inputs.expected_sha || github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=success
          description="broker-secret permission instrumentation passed"
          if [[ "${JOB_STATUS}" != success ]]; then
            state=failure
            description="broker-secret instrumentation job was ${JOB_STATUS}"
          fi
          payload="$(
            jq -n \
              --arg state "${state}" \
              --arg context "ci/broker-secret-instrumentation" \
              --arg description "${description}" \
              --arg target_url "${TARGET_URL}" \
              '{state: $state, context: $context, description: $description, target_url: $target_url}'
          )"
          gh api \
            --method POST \
            "repos/${{ github.repository }}/statuses/${TARGET_SHA}" \
            --input - \
            <<< "${payload}" \
            >/dev/null
          [[ "${state}" == success ]]
