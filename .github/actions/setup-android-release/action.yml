name: Set up Android release toolchain
description: Install the pinned Android/Rust toolchain, enable emulator acceleration, and build both required JNI ABIs.
runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"
    - name: Install Android SDK tools
      uses: android-actions/setup-android@v4
      with:
        packages: ""
    - name: Install pinned Android SDK components
      shell: bash
      run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "emulator" "system-images;android-35;google_apis;x86_64"
    - name: Enable KVM for Android emulator validation
      shell: bash
      run: |
        set -euo pipefail
        [[ -c /dev/kvm ]] || {
          echo '/dev/kvm is unavailable on this runner; hardware-accelerated release smoke testing is required' >&2
          exit 1
        }
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
          sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
    - name: Install Rust toolchain with Android targets
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,x86_64-linux-android
    - name: Cache Cargo artifacts
      uses: Swatinem/rust-cache@v2
    - name: Install cargo-ndk
      shell: bash
      run: cargo install cargo-ndk
    - name: Build Android Rust JNI libraries
      shell: bash
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
      run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build -p p2p-mobile --release

    - name: Install pinned bundletool
      shell: bash
      env:
        BUNDLETOOL_VERSION: "1.18.3"
        BUNDLETOOL_SHA256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
      run: |
        set -euo pipefail
        destination="$RUNNER_TEMP/bundletool-all-${BUNDLETOOL_VERSION}.jar"
        curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 0 \
          --output "$destination" \
          "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
        actual=$(sha256sum "$destination" | cut -d' ' -f1)
        [[ "$actual" == "$BUNDLETOOL_SHA256" ]] || {
          echo "bundletool SHA-256 mismatch: expected=$BUNDLETOOL_SHA256 actual=$actual" >&2
          exit 1
        }
        chmod 0444 "$destination"
        echo "BUNDLETOOL_JAR=$destination" >> "$GITHUB_ENV"
        echo "BUNDLETOOL_VERSION=$BUNDLETOOL_VERSION" >> "$GITHUB_ENV"
